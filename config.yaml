mcp_servers:
  blender:
    command: uvx
    args:
      - blender-mcp==1.6.4
    env:
      DISABLE_TELEMETRY: 'true'
    enabled: false
    tools:
      include:
        - get_scene_info
        - get_object_info
        - get_viewport_screenshot
        - execute_blender_code
  comfy-cloud:
    url: https://cloud.comfy.org/mcp
    auth: oauth
    enabled: true
    tools:
      include:
        - search_templates
        - get_template
        - get_template_schema
        - search_models
        - search_nodes
        - get_node
        - get_prompting_guide
        - run_template
        - submit_workflow
        - partner_generate
        - upload_file
        - apply_slots
        - get_job_status
        - wait_for_job
        - get_output
        - use_previous_output
        - cancel_job
        - get_queue
        - get_billing_status
        - get_workflow_canvas_url
  figma:
    url: https://mcp.figma.com/mcp
    auth: oauth
    enabled: true
  brave-search:
    command: mcp-server-brave-search
    args: []
    enabled: true
    env:
      BRAVE_API_KEY: ${BRAVE_API_KEY}
  chrome-devtools-win:
    command: chrome-devtools-mcp
    args:
      - --browserUrl
      - http://127.0.0.1:9222
      - --no-usage-statistics
    enabled: true
  codex:
    command: codex
    args:
      - mcp-server
    enabled: true
    timeout: 600
    connect_timeout: 120
  desktop-commander:
    command: npx
    args:
      - --yes
      - '@wonderwhy-er/desktop-commander@latest'
    timeout: 120
    connect_timeout: 60
    enabled: false
  filesystem:
    command: mcp-server-filesystem
    args:
      - D:/hermes-world
      - D:/Hermes-OS
      - D:/hermes-world/football-analytics
    enabled: true
  gbrain:
    command: gbrain
    args:
      - serve
    enabled: false
    env:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ZEROENTROPY_API_KEY: ${ZEROENTROPY_API_KEY}
  obsidian-vault:
    command: mcp-obsidian-vault
    args: []
    enabled: true
    env:
      OBSIDIAN_VAULT_PATH: D:/hermes-world/obsidian-vault
  omi:
    url: https://api.omi.me/v1/mcp/sse
    headers:
      Authorization: Bearer omi_mcp_72ce71448363c64cf1dbd9cb36f24ff1
    enabled: true
    timeout: 60
    connect_timeout: 15
  puppeteer:
    command: mcp-server-puppeteer
    args: []
    enabled: true
  qmd:
    command: qmd
    args:
      - mcp
    enabled: true
    timeout: 600
    connect_timeout: 120
  sequential-thinking:
    command: mcp-server-sequential-thinking
    args: []
    enabled: true
    timeout: 120
    connect_timeout: 60
  sqlite:
    command: mcp-sqlite-server
    args:
      - D:/hermes-world/football-analytics/db/football.db
    enabled: true
    timeout: 120
    connect_timeout: 60
  time:
    command: uvx
    args:
      - --from
      - mcp-server-time
      - --with
      - mcp==1.3.0
      - mcp-server-time
    enabled: true
  codegraph:
    command: codegraph
    args:
      - serve
      - --mcp
    timeout: 120
    connect_timeout: 60
    enabled: true
  n8n:
    command: D:/hermes/mcp-installs/n8n/.venv/Scripts/python.exe
    args:
      - D:/hermes/mcp-installs/n8n/server.py
      - --env
      - N8N_MCP_ENV=D:/Hermes-OS/.env
      - --connect-timeout
      - '30'
    enabled: true
  gemini-api-docs-mcp:
    url: https://gemini-api-docs-mcp.dev
    enabled: false
  sentry:
    url: https://mcp.sentry.dev/mcp
    enabled: false
  headroom:
    command: C:/Users/shane/AppData/Roaming/Python/Python314/Scripts/max.exe
    args:
      - mcp
      - serve
    enabled: false
  tokensave:
    command: C:\Users\shane\.local\bin\tokensave.exe
    args:
      - serve
    enabled: false
  cua-docs:
    url: https://vk-mcp.cua.ai/mcp
    enabled: true
    connect_timeout: 30
    description: CUA Docs & Code MCP — hosted read-only search over cua.ai documentation
      and versioned source (query_docs_db/vectors, query_code_db/vectors)
    docs: https://cua.ai/docs/reference/docs-code-mcp
  github:
    command: cmd.exe
    args:
      - '@modelcontextprotocol/server-github'
    enabled: false
